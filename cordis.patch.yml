# Bundle patch for dsh-persona.
#
# Inserted, not patched: id `persona` 不存在于任何下层 bundle。
# 这个文件属于插件自己，桌面端不会改写它（不像 ~/.dsh/profiles/desktop/cordis.patch.yml）。
#
# 想在这里写死配置也可以（优先级高于 $DSH_HOME/persona.config.json）：
#
#   - insert:
#       - id: persona
#         name: '@local/dsh-persona'
#         config:
#           userName: 朋友
#           userMark: ''
#           assistantName: 小助手
#           assistantMark: ''
#           tone: warm          # warm | lively | calm
#           emojiInChat: true
#           strictWorkOutput: true
#           extra: ''
#
# 日常改称呼用 `node setup.mjs` 就够了，不用动这个文件。
- insert:
    - id: persona
      name: '@local/dsh-persona'
